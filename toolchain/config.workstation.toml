[tools]
# Preserve both installed Flutter SDKs; first is the new-machine default.
flutter = ["3.47.5", "3.44.4"]
bun = "1.3"
java = "temurin-17"
"http:gcloud" = { version = "591.0.0", url = 'https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-{{ version }}-{{ os(macos="darwin") }}-{{ arch(x64="x86_64", arm64="arm") }}.tar.gz', strip_components = 1, bin_path = "bin" }
rust = "1.96.0"
# eza remains native: the registry plugin fails on mise 2026.11.0.
delta = "latest"
dust = "latest"
jless = "latest"
zellij = "latest"
qsv = "latest"
"cargo:git-trim" = "latest"

# Codex and Claude are intentionally outside repository tool management.
